name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check shell scripts
        run: bash -n build-release.sh install-macos.sh install-linux.sh

      - name: Run tests
        run: go test ./...

      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: ./build-release.sh

      - name: Show release checksums
        run: cat dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            dist/codex-deepseek-installer-"$VERSION"-macos-arm64.tar.gz \
            dist/codex-deepseek-installer-"$VERSION"-macos-amd64.tar.gz \
            dist/codex-deepseek-installer-"$VERSION"-linux-arm64.tar.gz \
            dist/codex-deepseek-installer-"$VERSION"-linux-amd64.tar.gz \
            dist/codex-deepseek-installer-"$VERSION"-windows-arm64.zip \
            dist/codex-deepseek-installer-"$VERSION"-windows-amd64.zip \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
